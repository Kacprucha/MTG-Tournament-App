spring:
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://localhost:8443/realms/app
          jwk-set-uri: http://keycloak:8443/realms/app/protocol/openid-connect/certs

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      enabled: true
      show-details: "when-authorized"
      roles:
        - "ADMIN"
    info:
      enabled: true
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    tryItOutEnabled: true
    operationsSorter: method
    tagsSorter: alpha
    filter: true

app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    keycloak: http://localhost:8443
    realm: app
    issuer-uri: ${app.jwt.keycloak}/realms/${app.jwt.realm}
    resource-client-id: frontend-web

logging:
  level:
    com.example.backend: DEBUG

---

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://db:5432/backend
    username: postgres
    password: postgres
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

app:
  jwt:
    keycloak: http://keycloak:8443